[package]
name = "cosmic-ext-applet-claudometer"
version = "0.1.0"
edition = "2024"
description = "COSMIC panel applet showing Claude Code and Codex usage limits, without starting model turns to check"
license = "MIT"
repository = "https://github.com/IllyaYalovyy/claudometer"

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "rt", "macros", "io-util", "time", "fs"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "43a50cb6f5af18fa6cbea535fb46460a3c5cd573"
default-features = false
features = ["applet", "tokio", "wayland", "winit"]

[dev-dependencies]
iced_tiny_skia = { git = "https://github.com/pop-os/libcosmic", rev = "43a50cb6f5af18fa6cbea535fb46460a3c5cd573" }

[features]
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]
